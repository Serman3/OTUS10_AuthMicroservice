services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
    ports:
      - "5432:5432"
    networks:
      - app-network
    container_name: auth_test_db

  discovery:
    build: ./discovery-service
    ports:
      - "8761:8761"
    networks:
      - app-network
    depends_on:
      - db
    container_name: discovery_service

  auth:
    build: ./spring-security-jwt
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth_db
    networks:
      - app-network
    depends_on:
      - discovery
    container_name: auth_service

  game:
    build: ./game-service
    networks:
      - app-network
    depends_on:
      - auth
    container_name: game_service

networks:
  app-network:
    driver: bridge